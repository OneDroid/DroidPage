<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DroidPage | Theme Demo</title>
    <link rel="icon" href="assets/img/droid-page-icon.png">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b1120;
            color: #94a3b8;
        }

        .demo-status {
            text-align: center;
        }

        .demo-spinner {
            width: 40px;
            height: 40px;
            margin: 0 auto 16px;
            border: 3px solid #29354f;
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div class="demo-status" id="demo-status">
        <div class="demo-spinner"></div>
        <p>Loading theme demo&hellip;</p>
    </div>
    <script type="module" src="assets/js/demo.js"></script>
</body>

</html>
